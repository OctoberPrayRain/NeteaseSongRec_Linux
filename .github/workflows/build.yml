name: Build Linux release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      SLINT_NO_QT: '1'
      SLINT_STYLE: fluent-light
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust clang pkgconf python nodejs \
            alsa-lib libpulse pipewire fontconfig freetype2 libxkbcommon \
            libxkbcommon-x11 libx11 libxcursor libxi libxrandr libglvnd wayland
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build client without NetEase resources
        run: |
          cargo build --release --locked
          node --check assets/netease/fingerprint_bridge.js
          python scripts/sync-netease-resources.py --help
      - name: Package client, corresponding sources and AUR metadata
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/package-release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: netease-songrec-linux-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: netease-songrec-linux-x86_64
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
