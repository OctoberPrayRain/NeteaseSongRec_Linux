[package]
name = "netease-songrec-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Linux desktop song recognition client using NetEase Music"
repository = "https://github.com/OctoberPrayRain/NeteaseSongRec_Linux"

[dependencies]
async-channel = "2.5.0"
cpal = { version = "0.18.1", features = ["pipewire"] }
log = "0.4"
rodio = { version = "0.23.0", default-features = false, features = ["vorbis", "hound", "minimp3", "symphonia-aiff", "symphonia-alac", "symphonia-aac", "symphonia-mkv", "flac"] }
pulsectl-rs = { version = "0.3.2", optional = true }
libpulse-binding = { version = "2.24.0", optional = true }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
slint = "=1.14.1"

[features]
default = ["pulse", "pipewire"]
pipewire = []
pulse = ["dep:pulsectl-rs", "dep:libpulse-binding"]

[build-dependencies]
slint-build = "=1.14.1"

[profile.release]
strip = true
